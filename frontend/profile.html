<!DOCTYPE html>
<html>
<head>

  <title>My Profile Dashboard</title>
  <link rel="stylesheet" href="style.css">

  <style>
  /* GOOGLE FONT */
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;
}

/* BODY */
body{
  min-height:100vh;

  background:
  linear-gradient(rgba(9,20,40,0.75), rgba(9,20,40,0.75)),
  url('https://images.unsplash.com/photo-1554224155-6726b3ff858f');

  background-size:cover;
  background-position:center;
}

/* HEADER */
.header{
  width:100%;
  padding:22px;

  text-align:center;
  color:white;

  background:rgba(255,255,255,0.08);
  backdrop-filter:blur(12px);

  border-bottom:1px solid rgba(255,255,255,0.1);

  box-shadow:0 8px 25px rgba(0,0,0,0.15);
}

.header h2{
  font-size:30px;
  font-weight:700;
  letter-spacing:1px;
}

/* CONTAINER */
.container{
  display:flex;
  justify-content:center;
  align-items:center;

  min-height:calc(100vh - 90px);
  padding:30px;
}

/* CARD */
.card{
  width:100%;
  max-width:420px;

  padding:32px;

  border-radius:24px;

  background:rgba(255,255,255,0.12);
  backdrop-filter:blur(18px);

  border:1px solid rgba(255,255,255,0.12);

  box-shadow:0 15px 40px rgba(0,0,0,0.25);

  color:white;
}

/* PROFILE BOX */
#profileBox{
  max-width:520px;
}

/* TITLE */
.card h3{
  margin-bottom:18px;
  font-size:24px;
  font-weight:600;
  text-align:center;
}

/* INPUT */
input{
  width:100%;
  padding:12px 14px;

  margin-top:12px;

  border:none;
  outline:none;

  border-radius:12px;

  background:rgba(255,255,255,0.12);

  color:white;
  font-size:14px;

  border:1px solid rgba(255,255,255,0.1);

  transition:0.3s;
}

/* PLACEHOLDER */
input::placeholder{
  color:#ddd;
}

/* INPUT FOCUS */
input:focus{
  border-color:#4da3ff;
  box-shadow:0 0 15px rgba(77,163,255,0.35);
}

/* BUTTON */
button{
  width:100%;

  margin-top:18px;
  padding:12px;

  border:none;
  border-radius:12px;

  background:linear-gradient(135deg,#0f6ed4,#0b4f9c);

  color:white;
  font-size:15px;
  font-weight:600;

  cursor:pointer;
  transition:0.3s;
}

/* BUTTON HOVER */
button:hover{
  transform:translateY(-2px);
  box-shadow:0 10px 22px rgba(15,110,212,0.35);
}

/* PROFILE TEXT */
#profileBox p{
  margin-top:10px;
  font-size:15px;
  color:#f1f1f1;
}

/* LOAN CARDS */
#loans div{
  margin-top:14px;

  padding:14px;

  border-radius:14px;

  background:rgba(255,255,255,0.08);

  border:1px solid rgba(255,255,255,0.08);
}

/* STATUS COLORS */
.pending{
  color:#ffb020;
}

.approved{
  color:#28c76f;
}

.rejected{
  color:#ff4d4f;
}

/* MOBILE */
@media(max-width:768px){

  .container{
    padding:18px;
  }

  .card{
    padding:24px;
  }

  .header h2{
    font-size:24px;
  }
}

  </style>
</head>

<body>

<div class="header">
  <h2>👤 My Profile Dashboard</h2>
</div>

<div class="container">

  <!-- LOGIN BOX -->
  <div class="card" id="loginBox">
    <h3>Login to Continue</h3>

    <input id="email" placeholder="Email">
    <input id="password" type="password" placeholder="Password">

    <button onclick="login()">Login</button>
  </div>

  <!-- PROFILE BOX -->
  <div class="card" id="profileBox" style="display:none">

    <h3>Welcome, <span id="name"></span></h3>

    <p>Email: <span id="emailShow"></span></p>
    <p>Phone: <span id="phoneShow"></span></p>

    <h3>📊 Loan Status</h3>
    <div id="loans"></div>

    <button onclick="logout()">Logout</button>

  </div>

</div>
<script>

async function login(){

  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  const res = await fetch("http://localhost:5000/api/auth/login", {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({email,password})
  });

  const data = await res.json();

  if(data.token){

    // save user
    localStorage.setItem("token", data.token);
    localStorage.setItem("userEmail", data.user.email);
    localStorage.setItem("userName", data.user.name);
    localStorage.setItem("userPhone", data.user.phone);

    showProfile(data.user);
    loadLoans();
  }
  else{
    alert(data.msg);
  }
}

function showProfile(user){

  document.getElementById("loginBox").style.display="none";
  document.getElementById("profileBox").style.display="block";

  document.getElementById("name").innerText = user.name;
  document.getElementById("emailShow").innerText = user.email;
  document.getElementById("phoneShow").innerText = user.phone;
}

async function loadLoans(){

  const email = localStorage.getItem("userEmail");

  const res = await fetch("http://localhost:5000/api/loan/myloans", {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({email})
  });

  const loans = await res.json();

  let html = "";

  loans.forEach(l=>{
    html += `
      <div style="border:1px solid #eee;padding:10px;margin-top:10px;border-radius:8px">
        <p>Amount: ₹${l.amount}</p>
        <p>Type: ${l.type}</p>
        <p>Status: <b>${l.status}</b></p>
      </div>
    `;
  });

  document.getElementById("loans").innerHTML = html;
}

function logout(){
  localStorage.clear();
  location.reload();
}
</script>

<script src="profile.js"></script>

</body>
</html>

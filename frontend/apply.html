<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Apply Loan</title>

<style>

/* GOOGLE FONT */
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

/* FULL PAGE */
body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:40px 20px;

    background:
    linear-gradient(rgba(10,15,30,0.75), rgba(10,15,30,0.75)),
    url('https://images.unsplash.com/photo-1554224155-6726b3ff858f');

    background-size:cover;
    background-position:center;
}

/* MAIN CARD */
.container{
    width:100%;
    max-width:1100px;

    background:rgba(255,255,255,0.12);
    backdrop-filter:blur(18px);

    border:1px solid rgba(255,255,255,0.15);

    border-radius:28px;
    padding:45px;

    box-shadow:
    0 10px 40px rgba(0,0,0,0.35);

    color:white;
}

/* TITLE */
.container h2{
    text-align:center;
    margin-bottom:35px;
    font-size:34px;
    font-weight:700;
    letter-spacing:1px;
}

/* GRID */
.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:24px;
}

/* FULL WIDTH */
.full{
    grid-column:span 2;
}

/* INPUT GROUP */
.input-box{
    display:flex;
    flex-direction:column;
}

/* LABEL */
label{
    margin-bottom:8px;
    font-size:14px;
    font-weight:500;
    color:#e8e8e8;
}

/* INPUT + SELECT */
/* INPUT + SELECT */
input,
select{
    width:100%;
    padding:11px 14px;   /* 🔥 normal size */

    border-radius:10px;
    border:1px solid rgba(255,255,255,0.12);

    background:rgba(255,255,255,0.08);

    color:white;
    font-size:14px;

    outline:none;
    transition:0.3s;
}

/* PLACEHOLDER */
input::placeholder{
    color:#d8d8d8;
}

/* FOCUS EFFECT */
input:focus,
select:focus{
    border-color:#4da3ff;
    box-shadow:0 0 15px rgba(77,163,255,0.4);

    background:rgba(255,255,255,0.12);
}

/* DROPDOWN */
select option{
    color:black;
}

/* BUTTON */
button{
    margin-top:25px;
    width:100%;
    padding:12px;

    border:none;
    border-radius:12px;

    background:linear-gradient(135deg,#0f6ed4,#1b8cff);

    color:white;
    font-size:15px;
    font-weight:600;

    cursor:pointer;
    transition:0.3s;
}

/* BUTTON HOVER */
button:hover{
    transform:translateY(-2px);
    box-shadow:0 8px 25px rgba(27,140,255,0.45);
}

/* MOBILE */
@media(max-width:768px){

    .container{
        padding:28px 20px;
    }

    .container h2{
        font-size:28px;
    }

    .form-grid{
        grid-template-columns:1fr;
    }

    .full{
        grid-column:span 1;
    }
}

.duration-box{
  display:flex;
  gap:10px;
}

.duration-box input{
  flex:2;
}

.duration-box select{
  flex:1;
  padding:12px;
  border-radius:10px;
  background:#4b4b4b;
  color:white;
  border:none;
}

</style>
</head>

<body>

<div class="container">

<h2>Loan Application Form</h2>

<form onsubmit="event.preventDefault(); submitForm()">

<div class="form-grid">

<div>
<label>First Name</label>
<input id="fname" required>
</div>

<div>
<label>Last Name</label>
<input id="lname" required>
</div>

<div>
    <label>Phone no.</label>
<input 
id="phone" 
type="tel"
maxlength="10"
placeholder="Enter 10 digit number"
required>
</div>

<div>
<label>Email</label>
<input id="email" type="email" required>
</div>

<div class="full">
<label>Address</label>
<input id="address" required>
</div>
<div>
<label>PAN Card</label>

<input 
id="pan"
maxlength="10"
placeholder="ABCDE1234F"
style="text-transform:uppercase"
required>

</div>

<div>
<label>Profession</label>
<select id="profession">
<option>Student</option>
<option>Goverment Job</option>
<option>Private Job</option>
<option>Business</option>
<option>Others</option>
</select>
</div>

<div>
<label>Loan Type</label>
<select id="type">
<option>Personal Loan</option>
<option>Car Loan</option>
<option>Gold Loan</option>
<option>Business Loan</option>
<option>Education Loan</option>
<option>Home Loan</option>
</select>
</div>

<div>
<label>Amount</label>
<input id="amount" type="number" required>
</div>

<div>
<label>Monthly Salary</label>
<input id="salary" type="number" required>
</div>

<div>
<label>Existing EMI</label>
<input id="emi" type="number" required>
</div>

<div>
<label>CIBIL Score</label>
<input id="cibil" type="number" required>
</div>

<div>
<label>Loan Duration (Months/Years)</label>
<div class="duration-box">

  <input 
    type="number"
    id="duration"
    placeholder="Enter Duration"
    required
  >

  <select id="durationType">
    <option value="months">Months</option>
    <option value="years">Years</option>
  </select>

</div>
</div>



<button type="submit">Submit Application</button>

</form>

</div>

<script>
async function submitForm(){


const phone = document.getElementById("phone").value;

// ✅ PHONE VALIDATION
const phonePattern = /^[6-9]\d{9}$/;

if(!phonePattern.test(phone)){
    alert("Please enter a valid 10-digit phone number");
    return;
}

const data = {

    fname: document.getElementById("fname").value,
    lname: document.getElementById("lname").value,
    phone: document.getElementById("phone").value,
    email: document.getElementById("email").value,
    address: document.getElementById("address").value,
    pan: document.getElementById("pan").value,
    profession: document.getElementById("profession").value,
    type: document.getElementById("type").value,
    amount: document.getElementById("amount").value,

    duration: document.getElementById("duration").value,
    durationType: document.getElementById("durationType").value,

    salary: document.getElementById("salary").value,
    emi: document.getElementById("emi").value,
    cibil: document.getElementById("cibil").value,
};

const res = await fetch("https://loanhub-management-system.onrender.com/api/loan/apply",{
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify(data)
});

const result = await res.json();
alert(result.msg);

// save locally
localStorage.setItem("loanData", JSON.stringify(data));

// redirect
window.location.href = "/success.html";
}
</script>
</body>
</html>
